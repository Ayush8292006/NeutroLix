<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#8CC63F" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29A9E0" />
      <stop offset="100%" stop-color="#0B5C8E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B5C8E" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Green Leaf Base -->
  <path d="M12 48 C 10 32, 22 16, 42 12 C 54 10, 56 16, 52 30 C 46 48, 30 54, 12 48 Z" fill="url(#leafGrad)" filter="url(#glow)"/>
  <path d="M16 45 Q 32 34 46 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Blue Water Drop -->
  <path d="M38 18 C 38 18, 50 32, 50 38 C 50 45, 44 50, 37 50 C 30 50, 24 45, 24 38 C 24 32, 38 18, 38 18 Z" fill="url(#dropGrad)"/>
  <circle cx="34" cy="36" r="3.5" fill="#ffffff" opacity="0.5"/>
</svg>

